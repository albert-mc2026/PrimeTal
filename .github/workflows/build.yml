name: Build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B package
      - run: gh release create build-${{ github.run_number }} target/PrimeTal.jar --title "PrimeTal build ${{ github.run_number }}" --notes "auto build"
        env:
          GH_TOKEN: ${{ github.token }}
